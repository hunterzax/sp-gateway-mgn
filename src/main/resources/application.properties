spring.application.name=datalink-gateway
# Enable file logging by default. Comment out to disable file logging.
spring.profiles.include=file-logging

# Database Configuration
# Values are loaded from environment variables (see .env file)
# Defaults are for local development only (no sensitive data)
spring.datasource.url=${GATEWAY_DATASOURCE_URL:jdbc:postgresql://localhost:5432/datalink_dev}
spring.datasource.username=${GATEWAY_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${GATEWAY_DATASOURCE_PASSWORD:}
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:validate}
spring.jpa.properties.hibernate.dialect=${SPRING_JPA_PROPERTIES_HIBERNATE_DIALECT:org.hibernate.dialect.PostgreSQLDialect}

# Kafka Configuration (KAFKA_* shared with ingest/client; gateway consumer uses KAFKA_GATEWAY_*)
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.group-id=${KAFKA_GATEWAY_CONSUMER_GROUP_ID:real-time-data-v3}
spring.kafka.consumer.auto-offset-reset=${KAFKA_GATEWAY_CONSUMER_AUTO_OFFSET_RESET:latest}
spring.kafka.template.default-topic=${KAFKA_TOPIC:sensor-data}

spring.kafka.consumer.max-poll-records=${KAFKA_GATEWAY_CONSUMER_MAX_POLL_RECORDS:200}
spring.kafka.listener.type=batch
spring.kafka.listener.concurrency=1
spring.kafka.listener.auto-startup=false

# Audit Logger Async Thread Pool
audit.logger.async.core-pool-size=${AUDIT_LOGGER_ASYNC_CORE_POOL_SIZE:2}
audit.logger.async.max-pool-size=${AUDIT_LOGGER_ASYNC_MAX_POOL_SIZE:5}
audit.logger.async.queue-capacity=${AUDIT_LOGGER_ASYNC_QUEUE_CAPACITY:100}

server.port=${GATEWAY_SERVER_PORT:8080}

# Security — secrets are injected via environment variables.
# No default values are provided; these MUST be set at deploy time.
jwt.secret=${JWT_SECRET}
