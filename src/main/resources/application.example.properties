spring.application.name=datalink-gateway
# Enable file logging by default. Comment out to disable file logging.
spring.profiles.include=file-logging

# Database Configuration
spring.datasource.url=jdbc:postgresql://xxxx:xxxx/datalink01
spring.datasource.username=xxxx
spring.datasource.password=xxxx
spring.jpa.hibernate.ddl-auto=create
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Kafka — set KAFKA_BOOTSTRAP_SERVERS, KAFKA_TOPIC, KAFKA_GATEWAY_* in env (see .env.example).
spring.kafka.bootstrap-servers=xxxx:xxxx
spring.kafka.consumer.group-id=real-time-data
spring.kafka.consumer.auto-offset-reset=latest
spring.kafka.template.default-topic=sensor-data

spring.kafka.consumer.max-poll-records=200
spring.kafka.listener.type=batch
spring.kafka.listener.concurrency=3

# Audit Logger Async Thread Pool
audit.logger.async.core-pool-size=2
audit.logger.async.max-pool-size=5
audit.logger.async.queue-capacity=100
